name: Release Multiplataforma (Windows, Linux, macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Ubuntu Linux
          - os: macos-14
            target: aarch64-apple-darwin
            name: macOS (Apple Silicon)

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Dependências do Linux (Ubuntu)
      - name: Instalar dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libx11-dev \
            libxtst-dev \
            cmake \
            ninja-build \
            clang

      # Dependências do macOS
      - name: Instalar dependências (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      # Instalar pacotes npm
      - name: Instalar dependências npm
        run: npm ci

      # Garantir que o vc_redist esteja presente ou simulado para o bundler do Tauri
      - name: Preparar recursos específicos
        shell: bash
        run: |
          mkdir -p src-tauri/windows
          if [ "${{ runner.os }}" = "Windows" ]; then
            if [ ! -f "src-tauri/windows/vc_redist.x64.exe" ]; then
              curl -L -o src-tauri/windows/vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
            fi
          else
            # No Linux e macOS, cria arquivo vazio para satisfazer a verificação de recursos do Tauri
            touch src-tauri/windows/vc_redist.x64.exe
          fi

      # Compilação e empacotamento com Tauri
      - name: Build do frontend e binários Tauri
        shell: bash
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Flags portáveis do whisper.cpp no Windows/Linux
          GGML_NATIVE: "OFF"
          GGML_AVX: "ON"
          GGML_AVX2: "OFF"
          GGML_AVX512: "OFF"
          GGML_FMA: "OFF"
        run: |
          npm run tauri build

      # Gera o manifesto latest.json consumido pelo auto-updater
      - name: Gerar manifesto do auto-updater (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\make-latest-json.ps1 -Notes "Versao ${{ github.ref_name }} do Whisper App."

      # Upload dos artefatos diretamente para a Release no GitHub
      - name: Publicar artefatos no GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/nsis/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
